name: Native Registry

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'tooling/registry-lab/**'
      - '.github/workflows/native_registry.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'tooling/registry-lab/**'
      - '.github/workflows/native_registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    name: Registry and publication probes on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Storage lab safety tests (no devices or privileges)
        if: runner.os == 'Linux'
        working-directory: .
        run: python -B -m unittest discover -s tooling/registry-lab -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Formatting
        run: cargo fmt --check
      - name: Library tests, including test-only publication probes
        run: cargo test --locked --lib
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Upload storage environment observations (not qualification proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-storage-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: src-tauri/target/registry-qualification/storage-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
