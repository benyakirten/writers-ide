[package]
name = "application-integration-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "application-integration-fixture"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
test = false

[build-dependencies]
sha2 = "0.10.9"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
semver = "1.0.28"
sha2 = "0.10.9"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "backup"] }
getrandom = "0.4.3"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
